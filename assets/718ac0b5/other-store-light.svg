<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 206" width="430" height="206" role="img" aria-label="무인 상점 이상행동 인식 (개인 프로젝트 · 진행 중): CCTV를 가정해 사람의 2D 자세 시퀀스로 기물 파손 · 폭력 · 쓰러짐 같은 동작을 구분합니다. YOLO Pose로 구분할 동작 17가지">
<defs><style>
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
.drift{animation:drift 12s ease-in-out infinite alternate}
.drift2{animation:drift2 15s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(70px,26px)}}
@keyframes drift2{to{transform:translate(-80px,-20px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard Variable', Pretendard, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<rect width="430" height="206" rx="26" fill="#f5f5f7"/>
<g class="up d1">
<rect x="24" y="24" width="54" height="54" rx="16" fill="#ffffff"/>
<text x="51" y="60" text-anchor="middle" font-size="27" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">🏪</text>
<text x="94" y="47" font-size="20" font-weight="700" letter-spacing="-.4" fill="#1d1d1f">무인 상점 이상행동 인식</text>
<circle class="pulse" cx="98" cy="66" r="3.5" fill="#1d8a3a"/>
<circle cx="98" cy="66" r="3.5" fill="#1d8a3a"/><text x="108" y="70.5" font-size="13" font-weight="500" fill="#6e6e73">개인 프로젝트 · 진행 중</text>
<text x="24" y="114" font-size="15" fill="#6e6e73">CCTV를 가정해 사람의 2D 자세 시퀀스로</text>
<text x="24" y="137" font-size="15" fill="#6e6e73">기물 파손 · 폭력 · 쓰러짐 같은 동작을 구분합니다.</text>
<text x="24" y="182" font-size="22" font-weight="700" letter-spacing="-.4" fill="#4f46d8">17가지<tspan dx="10" font-size="13" font-weight="500" letter-spacing="0" fill="#6e6e73">YOLO Pose로 구분할 동작</tspan></text>
</g>
</g>
</svg>
