<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 206" width="430" height="206" role="img" aria-label="조각김치 이물 검출 (팀 프로젝트 · 완료): 직접 만든 라벨링 도구로 사진 900장을 교차검수하고 YOLO11 검출 성능을 높였습니다. Validation mAP50–95 0.470 → 0.749">
<defs><style>
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
.drift{animation:drift 12s ease-in-out infinite alternate}
.drift2{animation:drift2 15s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(70px,26px)}}
@keyframes drift2{to{transform:translate(-80px,-20px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard Variable', Pretendard, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<rect width="430" height="206" rx="26" fill="#1c1c1e"/>
<g class="up d1">
<rect x="24" y="24" width="54" height="54" rx="16" fill="#2c2c2e"/>
<text x="51" y="60" text-anchor="middle" font-size="27" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">🥬</text>
<text x="94" y="47" font-size="20" font-weight="700" letter-spacing="-.4" fill="#f5f5f7">조각김치 이물 검출</text>
<circle cx="98" cy="66" r="3.5" fill="#98989d"/><text x="108" y="70.5" font-size="13" font-weight="500" fill="#98989d">팀 프로젝트 · 완료</text>
<text x="24" y="114" font-size="15" fill="#98989d">직접 만든 라벨링 도구로 사진 900장을</text>
<text x="24" y="137" font-size="15" fill="#98989d">교차검수하고 YOLO11 검출 성능을 높였습니다.</text>
<text x="24" y="182" font-size="22" font-weight="700" letter-spacing="-.4" fill="#40c8e0">0.470 → 0.749<tspan dx="10" font-size="13" font-weight="500" letter-spacing="0" fill="#98989d">Validation mAP50–95</tspan></text>
</g>
</g>
</svg>
