<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Hyesung — Building AI vision tools and apps, and writing down what I learn.">
<defs><style>
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}.d5{animation-delay:.5s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.5s cubic-bezier(.2,.7,.2,1) .5s both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
.drift{animation:drift 12s ease-in-out infinite alternate}
.drift2{animation:drift2 15s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(70px,26px)}}
@keyframes drift2{to{transform:translate(-80px,-20px)}}
.pop{animation:pop .4s ease both}
@keyframes pop{from{opacity:.12}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><clipPath id="c"><rect width="880" height="330" rx="32"/></clipPath>
<filter id="b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
<linearGradient id="gt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#2997ff"/><stop offset=".5" stop-color="#bf5af2"/><stop offset="1" stop-color="#ff375f"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="880 0" dur="9s" repeatCount="indefinite"/>
</linearGradient></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard Variable', Pretendard, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<g clip-path="url(#c)">
<rect width="880" height="330" fill="#1c1c1e"/>
<g filter="url(#b)" opacity="0.34">
<circle class="drift" cx="90" cy="300" r="120" fill="#2997ff"/>
<circle class="drift2" cx="800" cy="40" r="120" fill="#bf5af2"/>
<circle class="drift" cx="700" cy="330" r="90" fill="#ff375f"/>
</g>
</g>
<g class="up">
<rect x="418.0" y="40" width="44" height="44" rx="12" fill="#f5f5f7"/>
<text x="440.0" y="70" text-anchor="middle" font-size="23" font-weight="800" fill="#1c1c1e">H</text>
</g>
<text class="up d1" x="440.0" y="122" text-anchor="middle" font-size="16" font-weight="600" fill="#98989d">AI Vision · Apps · Games</text>
<text class="up d2" x="440.0" y="200" text-anchor="middle" font-size="78" font-weight="700" letter-spacing="-2.5" fill="#f5f5f7">Hyesung.</text>
<text class="up d3" x="440.0" y="246" text-anchor="middle" font-size="23" font-weight="600" letter-spacing="-.3" fill="url(#gt)">Building AI vision tools and apps, and writing down what I learn.</text>
<text class="up d4" x="440.0" y="284" text-anchor="middle" font-size="14.5" fill="#98989d">머신비전 · 딥러닝 · AI 서비스 개발을 공부하며, 직접 쓰고 싶은 앱과 게임을 만듭니다.</text>
</g>
</svg>
