<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="880" height="170" role="img" aria-label="AI · Vision: PyTorch, TensorFlow · Keras, MediaPipe, YOLO Pose, OpenCV / Serving: FastAPI, Celery, Redis, PostgreSQL, Docker Compose / App · Game: Godot 4, Kotlin, JavaScript, WebSocket">
<defs><style>
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}.d5{animation-delay:.5s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.5s cubic-bezier(.2,.7,.2,1) .5s both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
.drift{animation:drift 12s ease-in-out infinite alternate}
.drift2{animation:drift2 15s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(70px,26px)}}
@keyframes drift2{to{transform:translate(-80px,-20px)}}
.pop{animation:pop .4s ease both}
@keyframes pop{from{opacity:.12}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard Variable', Pretendard, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<g transform="translate(0 0)"><g class="up d1">
<rect width="280" height="170" rx="24" fill="#f5f5f7"/>
<text x="36" y="44" text-anchor="middle" font-size="20" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">🤖</text>
<text x="56" y="43" font-size="17" font-weight="700" letter-spacing="-.2" fill="#1d1d1f">AI · Vision</text>
<rect x="22" y="62" width="76" height="28" rx="14" fill="#ffffff"/><text x="60" y="81" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">PyTorch</text>
<rect x="105" y="62" width="142" height="28" rx="14" fill="#ffffff"/><text x="176" y="81" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">TensorFlow · Keras</text>
<rect x="22" y="96" width="83" height="28" rx="14" fill="#ffffff"/><text x="64" y="115" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">MediaPipe</text>
<rect x="112" y="96" width="90" height="28" rx="14" fill="#ffffff"/><text x="157" y="115" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">YOLO Pose</text>
<rect x="22" y="130" width="70" height="28" rx="14" fill="#ffffff"/><text x="57" y="149" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">OpenCV</text>
</g></g>
<g transform="translate(300 0)"><g class="up d2">
<rect width="280" height="170" rx="24" fill="#f5f5f7"/>
