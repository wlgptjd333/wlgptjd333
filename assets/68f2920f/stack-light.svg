<rect x="22" y="62" width="78" height="28" rx="14" fill="#ffffff"/><text x="61" y="81" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">FastAPI</text>
<rect x="107" y="62" width="64" height="28" rx="14" fill="#ffffff"/><text x="139" y="81" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">Celery</text>
