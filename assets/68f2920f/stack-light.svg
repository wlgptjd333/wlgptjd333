<rect x="22" y="96" width="99" height="28" rx="14" fill="#ffffff"/><text x="72" y="115" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">PostgreSQL</text>
<rect x="128" y="96" width="123" height="28" rx="14" fill="#ffffff"/><text x="190" y="115" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">Docker Compose</text>
</g></g>
<g transform="translate(600 0)"><g class="up d3">
<rect width="280" height="170" rx="24" fill="#f5f5f7"/>
<text x="36" y="44" text-anchor="middle" font-size="20" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">🎮</text>
<text x="56" y="43" font-size="17" font-weight="700" letter-spacing="-.2" fill="#1d1d1f">App · Game</text>
<rect x="22" y="62" width="72" height="28" rx="14" fill="#ffffff"/><text x="58" y="81" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">Godot 4</text>
<rect x="101" y="62" width="61" height="28" rx="14" fill="#ffffff"/><text x="132" y="81" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">Kotlin</text>
<rect x="22" y="96" width="93" height="28" rx="14" fill="#ffffff"/><text x="69" y="115" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">JavaScript</text>
<rect x="122" y="96" width="90" height="28" rx="14" fill="#ffffff"/><text x="167" y="115" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">WebSocket</text>
