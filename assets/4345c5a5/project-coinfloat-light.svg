<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 172" width="880" height="172" role="img" aria-label="CoinFloat: 다른 앱 위에 뜨는 초소형 실시간 시세 오버레이. 직접 쓰면서 6주 동안 78회 릴리스했습니다.">
<defs><style>
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}.d5{animation-delay:.5s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.5s cubic-bezier(.2,.7,.2,1) .5s both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
.drift{animation:drift 12s ease-in-out infinite alternate}
.drift2{animation:drift2 15s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(70px,26px)}}
@keyframes drift2{to{transform:translate(-80px,-20px)}}
.pop{animation:pop .4s ease both}
@keyframes pop{from{opacity:.12}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard Variable', Pretendard, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<g class="up">
<rect width="880" height="172" rx="24" fill="#f5f5f7"/>
<rect x="28" y="28" width="60" height="60" rx="16" fill="#ffffff"/>
<text x="58" y="69" text-anchor="middle" font-size="30" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">🪙</text>
<text x="108" y="44" font-size="12.5" font-weight="700" letter-spacing=".6" fill="#0066cc">ANDROID · WEB</text>
<text x="107" y="75" font-size="25" font-weight="700" letter-spacing="-.5" fill="#1d1d1f">CoinFloat</text>
<text x="108" y="102" font-size="15" fill="#6e6e73">다른 앱 위에 뜨는 초소형 실시간 시세 오버레이. 직접 쓰면서 6주 동안 78회 릴리스했습니다.</text>
<rect x="108" y="120" width="61" height="28" rx="14" fill="#ffffff"/><text x="138" y="139" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">Kotlin</text>
<rect x="176" y="120" width="93" height="28" rx="14" fill="#ffffff"/><text x="222" y="139" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">JavaScript</text>
<rect x="276" y="120" width="90" height="28" rx="14" fill="#ffffff"/><text x="321" y="139" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">WebSocket</text>
<rect x="373" y="120" width="144" height="28" rx="14" fill="#ffffff"/><text x="445" y="139" text-anchor="middle" font-size="13" font-weight="500" fill="#6e6e73">Lightweight Charts</text>
<rect x="788" y="28" width="64" height="26" rx="13" fill="#e3f5e8"/>
<circle class="pulse" cx="803" cy="41" r="4" fill="#248a3d"/><circle cx="803" cy="41" r="4" fill="#248a3d"/>
<text x="813" y="45.5" font-size="13" font-weight="700" fill="#248a3d">Live</text>
</g>
</g>
</svg>
