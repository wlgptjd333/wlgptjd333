<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 172" width="880" height="172" role="img" aria-label="InkLog: 종이 점검일지를 사진 한 장으로 칸별 데이터로 바꾸고, 범위를 벗어난 값은 바로 알려 줍니다.">
<defs><style>
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}.d5{animation-delay:.5s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.5s cubic-bezier(.2,.7,.2,1) .5s both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
.drift{animation:drift 12s ease-in-out infinite alternate}
.drift2{animation:drift2 15s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(70px,26px)}}
@keyframes drift2{to{transform:translate(-80px,-20px)}}
.pop{animation:pop .4s ease both}
@keyframes pop{from{opacity:.12}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard Variable', Pretendard, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<g class="up">
<rect width="880" height="172" rx="24" fill="#1c1c1e"/>
<rect x="28" y="28" width="60" height="60" rx="16" fill="#2c2c2e"/>
<text x="58" y="69" text-anchor="middle" font-size="30" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">📝</text>
<text x="108" y="44" font-size="12.5" font-weight="700" letter-spacing=".6" fill="#2997ff">OCR · 미니프로젝트</text>
<text x="107" y="75" font-size="25" font-weight="700" letter-spacing="-.5" fill="#f5f5f7">InkLog</text>
<text x="108" y="102" font-size="15" fill="#98989d">종이 점검일지를 사진 한 장으로 칸별 데이터로 바꾸고, 범위를 벗어난 값은 바로 알려 줍니다.</text>
<rect x="108" y="120" width="70" height="28" rx="14" fill="#2c2c2e"/><text x="143" y="139" text-anchor="middle" font-size="13" font-weight="500" fill="#98989d">OpenCV</text>
<rect x="185" y="120" width="49" height="28" rx="14" fill="#2c2c2e"/><text x="210" y="139" text-anchor="middle" font-size="13" font-weight="500" fill="#98989d">OCR</text>
<rect x="241" y="120" width="67" height="28" rx="14" fill="#2c2c2e"/><text x="275" y="139" text-anchor="middle" font-size="13" font-weight="500" fill="#98989d">Python</text>
<rect x="315" y="120" width="78" height="28" rx="14" fill="#2c2c2e"/><text x="355" y="139" text-anchor="middle" font-size="13" font-weight="500" fill="#98989d">FastAPI</text>
<rect x="736" y="28" width="116" height="26" rx="13" fill="#3a2a10"/>
<circle cx="751" cy="41" r="4" fill="#ff9f0a"/>
<text x="761" y="45.5" font-size="13" font-weight="700" fill="#ff9f0a">In progress</text>
</g>
</g>
</svg>
