<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="04 InkLog (진행 중): 종이 점검일지를 사진 한 장으로 칸별 데이터로">
  <defs>
