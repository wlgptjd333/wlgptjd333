<text x="112" y="143" font-size="15.5" fill="#98989d">직접 쓰면서 계속 고쳐 배포하고 있습니다.</text>
<rect x="112" y="164" width="61" height="28" rx="14" fill="#2c2c2e"/>
<text x="142.3" y="182.7" text-anchor="middle" font-size="13" font-weight="500" fill="#98989d">Kotlin</text>
