<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="01 Body Hero (팀장 · 졸업작품): 웹캠 하나로 펀치 · 어퍼컷 · 가드 · 스쿼트를 인식해 몬스터와 싸우는 2D 복싱 게임입니다. 동작 7가지 분류 정확도 99.0%, GPU 없이 실시간 인식 30 FPS">
<defs><style>
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
.drift{animation:drift 12s ease-in-out infinite alternate}
.drift2{animation:drift2 15s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(70px,26px)}}
@keyframes drift2{to{transform:translate(-80px,-20px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard Variable', Pretendard, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<rect width="880" height="220" rx="28" fill="#1c1c1e"/>
<g class="up d1">
<rect x="28" y="28" width="64" height="64" rx="18" fill="#2c2c2e"/>
<text x="60" y="71" text-anchor="middle" font-size="32" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">🥊</text>
<text x="112" y="45" font-size="12.5" font-weight="700" letter-spacing=".9" fill="#ff375f">01  ·  POSE ESTIMATION · GAME</text>
<text x="111" y="82" font-size="30" font-weight="700" letter-spacing="-.6" fill="#f5f5f7">Body Hero</text>
<rect x="275" y="61" width="50" height="26" rx="13" fill="#ff375f" fill-opacity=".14"/><text x="299" y="78.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ff375f">팀장</text>
<rect x="330" y="61" width="77" height="26" rx="13" fill="#ff375f" fill-opacity=".14"/><text x="369" y="78.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ff375f">졸업작품</text>
<text x="112" y="120" font-size="15.5" fill="#98989d">웹캠 하나로 펀치 · 어퍼컷 · 가드 · 스쿼트를 인식해</text>
<text x="112" y="143" font-size="15.5" fill="#98989d">몬스터와 싸우는 2D 복싱 게임입니다.</text>
<rect x="112" y="164" width="116" height="28" rx="14" fill="#2c2c2e"/>
<text x="170.0" y="182.7" text-anchor="middle" font-size="13" font-weight="500" fill="#98989d">MediaPipe Pose</text>
<rect x="235" y="164" width="73" height="28" rx="14" fill="#2c2c2e"/>
<text x="271.4" y="182.7" text-anchor="middle" font-size="13" font-weight="500" fill="#98989d">1D-CNN</text>
<rect x="315" y="164" width="95" height="28" rx="14" fill="#2c2c2e"/>
<text x="362.0" y="182.7" text-anchor="middle" font-size="13" font-weight="500" fill="#98989d">TensorFlow</text>
<rect x="416" y="164" width="84" height="28" rx="14" fill="#2c2c2e"/>
<text x="458.5" y="182.7" text-anchor="middle" font-size="13" font-weight="500" fill="#98989d">Godot 4.6</text>
</g>
<g class="up d2">
<rect x="600" y="20" width="252" height="180" rx="22" fill="#2c2c2e"/>
<text x="624" y="80" font-size="46" font-weight="700" letter-spacing="-1.4" fill="#ff375f">99.0<tspan dx="2" font-size="26" font-weight="600" letter-spacing="0">%</tspan></text>
<text x="625" y="104" font-size="13.5" font-weight="500" fill="#98989d">동작 7가지 분류 정확도</text>
<rect x="624" y="122" width="204" height="1" fill="#3a3a3c"/>
<text x="624" y="162" font-size="30" font-weight="700" letter-spacing="-0.9" fill="#f5f5f7">30<tspan dx="4" font-size="13" font-weight="600" letter-spacing="0">FPS</tspan></text>
<text x="625" y="185" font-size="13.5" font-weight="500" fill="#98989d">GPU 없이 실시간 인식</text>
</g>
</g>
</svg>
