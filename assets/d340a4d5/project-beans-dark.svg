<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="02 콩잎 질병 분류 API: 콩잎 사진을 정상 · 각진잎반점병 · 녹병으로 나누는 ResNet-18을 FastAPI 동기 · 비동기 API로 서빙합니다. Test 정확도 · 기준선 71.9% 97.7%, 동기 API 응답 시간 22 ms">
<defs><style>
.up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
.drift{animation:drift 12s ease-in-out infinite alternate}
.drift2{animation:drift2 15s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(70px,26px)}}
@keyframes drift2{to{transform:translate(-80px,-20px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Pretendard Variable', Pretendard, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<rect width="880" height="220" rx="28" fill="#1c1c1e"/>
<g class="up d1">
<rect x="28" y="28" width="64" height="64" rx="18" fill="#2c2c2e"/>
<text x="60" y="71" text-anchor="middle" font-size="32" font-family="'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif">🌱</text>
<text x="112" y="45" font-size="12.5" font-weight="700" letter-spacing=".9" fill="#30d158">02  ·  VISION AI · MODEL SERVING</text>
<text x="111" y="82" font-size="30" font-weight="700" letter-spacing="-.6" fill="#f5f5f7">콩잎 질병 분류 API</text>
<text x="112" y="120" font-size="15.5" fill="#98989d">콩잎 사진을 정상 · 각진잎반점병 · 녹병으로 나누는</text>
<text x="112" y="143" font-size="15.5" fill="#98989d">ResNet-18을 FastAPI 동기 · 비동기 API로 서빙합니다.</text>
<rect x="112" y="164" width="76" height="28" rx="14" fill="#2c2c2e"/>
<text x="149.9" y="182.7" text-anchor="middle" font-size="13" font-weight="500" fill="#98989d">PyTorch</text>
<rect x="195" y="164" width="78" height="28" rx="14" fill="#2c2c2e"/>
<text x="233.9" y="182.7" text-anchor="middle" font-size="13" font-weight="500" fill="#98989d">FastAPI</text>
<rect x="280" y="164" width="64" height="28" rx="14" fill="#2c2c2e"/>
<text x="312.1" y="182.7" text-anchor="middle" font-size="13" font-weight="500" fill="#98989d">Celery</text>
<rect x="351" y="164" width="57" height="28" rx="14" fill="#2c2c2e"/>
<text x="379.6" y="182.7" text-anchor="middle" font-size="13" font-weight="500" fill="#98989d">Redis</text>
<rect x="415" y="164" width="99" height="28" rx="14" fill="#2c2c2e"/>
<text x="464.8" y="182.7" text-anchor="middle" font-size="13" font-weight="500" fill="#98989d">PostgreSQL</text>
</g>
<g class="up d2">
<rect x="600" y="20" width="252" height="180" rx="22" fill="#2c2c2e"/>
<text x="624" y="80" font-size="46" font-weight="700" letter-spacing="-1.4" fill="#30d158">97.7<tspan dx="2" font-size="26" font-weight="600" letter-spacing="0">%</tspan></text>
<text x="625" y="104" font-size="13.5" font-weight="500" fill="#98989d">Test 정확도 · 기준선 71.9%</text>
<rect x="624" y="122" width="204" height="1" fill="#3a3a3c"/>
<text x="624" y="162" font-size="30" font-weight="700" letter-spacing="-0.9" fill="#f5f5f7">22<tspan dx="4" font-size="13" font-weight="600" letter-spacing="0">ms</tspan></text>
<text x="625" y="185" font-size="13.5" font-weight="500" fill="#98989d">동기 API 응답 시간</text>
</g>
</g>
</svg>
